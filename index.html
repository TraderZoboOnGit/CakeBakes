<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mom's Sweet Treats</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
      background:#fff9f5;
      color:#333;
      line-height:1.5;
      padding-bottom:90px; /* space for fixed footer */
    }

    /* Header */
    .header{
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      color:#fff;
      padding:1.5rem 1rem;
      text-align:center;
      box-shadow: 0 4px 12px rgba(255, 118, 140, 0.2);
    }
    .brand-name{
      font-size:2.2rem;
      font-weight:800;
      margin-bottom:0.5rem;
      letter-spacing:0.5px;
    }
    .brand-subtitle{
      font-size:1.1rem;
      opacity:0.95;
      max-width:650px;
      margin:0 auto;
    }

    /* Hero */
    .hero{
      width:100%;
      height:300px;
      background:
        linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)),
        url('https://images.unsplash.com/photo-1535141192574-5d4897c12636?auto=format&fit=crop&w=1200&q=80');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:2rem;
    }
    .hero-text{ color:#fff; text-align:center; padding:0 1rem; }
    .hero-text h1{
      font-size:2.5rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.45);
      margin-bottom:0.5rem;
    }
    .hero-text p{
      font-size:1.2rem;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.45);
    }

    /* CTA */
    .cta-section{ padding: 0 1rem 2rem; text-align:center; }
    .cta-title{
      font-size:1.8rem;
      color:#ff5a8c;
      margin-bottom:1.2rem;
      font-weight:750;
    }
    .button-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:1rem;
      max-width:460px;
      margin:0 auto 0.5rem;
    }

    /* Less “scammy” buttons: softer, calmer */
    .big-button{
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:16px;
      padding:1.1rem;
      font-size:1.25rem;
      font-weight:650;
      color:#2c2c2c;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      cursor:pointer;
      min-height:70px;
    }
    .big-button:hover, .big-button:active{
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.10);
    }

    /* Calm bakery primary (pink) */
    .big-button.primary{
      background: linear-gradient(135deg, #ff7eb3, #ff9bc9);
      color:#fff;
      border:1px solid rgba(255,126,179,0.35);
    }

    /* Softer FB + Messenger */
    .big-button.facebook{
      background:#f3f6ff;
      color:#1f3a8a;
      border:1px solid rgba(24,119,242,0.18);
    }
    .big-button.messenger{
      background:#eff9ff;
      color:#075985;
      border:1px solid rgba(0,132,255,0.18);
    }

    .button-icon{
      font-size:1.6rem;
      margin-right:12px;
      opacity:0.95;
    }

    .tiny-help{
      max-width:650px;
      margin: 1rem auto 0;
      color:#666;
      font-size:1rem;
    }

    /* Gallery */
    .gallery-section{ padding: 0 1rem; }
    .section-title{
      font-size:1.8rem;
      color:#ff5a8c;
      margin-bottom:1.5rem;
      text-align:center;
      font-weight:750;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap:1.5rem;
      max-width:1200px;
      margin:0 auto;
    }
    .tile{
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.10);
      transition: transform 0.18s ease;
      cursor:pointer;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .tile:hover{ transform: translateY(-3px); }
    .tile-img{ width:100%; height:220px; object-fit:cover; display:block; }
    .tile-content{ padding:1.2rem; }
    .tile-title{ font-size:1.35rem; font-weight:750; color:#333; margin-bottom:0.4rem; }
    .tile-note{ font-size:1rem; color:#666; line-height:1.4; }

    /* Modal */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.88);
      z-index:1000;
      align-items:center;
      justify-content:center;
      padding:1rem;
    }
    .modal.show{ display:flex; }
    .modal-content{
      background:#fff;
      border-radius:20px;
      width:100%;
      max-width:540px;
      overflow:hidden;
      animation: modalSlide 0.25s ease;
      position:relative;
    }
    @keyframes modalSlide{
      from{ transform: translateY(18px); opacity:0; }
      to{ transform: translateY(0); opacity:1; }
    }
    .modal-img{ width:100%; height:320px; object-fit:cover; }
    .modal-body{ padding:1.5rem; }
    .modal-title{ font-size:1.8rem; font-weight:800; color:#333; margin-bottom:0.4rem; }
    .modal-note{ font-size:1.1rem; color:#666; margin-bottom:1.2rem; line-height:1.4; }
    .modal-buttons{ display:grid; gap:1rem; }

    .close-modal{
      position:absolute;
      top:14px;
      right:14px;
      background: rgba(255,255,255,0.92);
      border:1px solid rgba(0,0,0,0.10);
      width:48px;
      height:48px;
      border-radius:50%;
      font-size:1.8rem;
      color:#333;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    /* Footer (less loud, cleaner) */
    .footer{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      background: rgba(255,255,255,0.96);
      padding:0.9rem 1rem;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.10);
      border-top:1px solid rgba(0,0,0,0.06);
      z-index:100;
      backdrop-filter: blur(10px);
    }
    .footer-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0.9rem;
      max-width:520px;
      margin:0 auto;
    }
    .footer-button{
      background:#fff;
      color:#2c2c2c;
      border:1px solid rgba(0,0,0,0.08);
      border-radius:14px;
      padding:0.95rem;
      font-size:1.05rem;
      font-weight:750;
      cursor:pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }
    .footer-button:hover, .footer-button:active{
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(0,0,0,0.10);
    }

    /* Responsive */
    @media (max-width: 768px){
      .grid{ grid-template-columns:1fr; }
      .hero{ height:250px; }
      .hero-text h1{ font-size:2rem; }
      .brand-name{ font-size:1.8rem; }
      .big-button{ font-size:1.2rem; min-height:65px; }
    }
    @media (max-width: 480px){
      .hero{ height:200px; }
      .brand-name{ font-size:1.6rem; }
      .brand-subtitle{ font-size:1rem; }
      .big-button{ padding:1rem; font-size:1.1rem; }
      .footer-buttons{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="header">
    <div class="brand-name" id="brandName">Mom's Sweet Treats</div>
    <div class="brand-subtitle" id="brandSub">Made with love • Local pickup • Message to order</div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-text">
      <h1>Sweet Treats Made Fresh</h1>
      <p>Tap a photo below to see it bigger</p>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta-section">
    <h2 class="cta-title">Message to Order</h2>
    <div class="button-grid">
      <button class="big-button primary" id="btnText">
        <span class="button-icon">📱</span> Text Message
      </button>
      <button class="big-button messenger" id="btnMsg">
        <span class="button-icon">💬</span> Messenger
      </button>
      <button class="big-button facebook" id="btnFB">
        <span class="button-icon">👍</span> Facebook Page
      </button>
    </div>
    <div class="tiny-help">No online checkout yet — just message and we’ll confirm the order 😊</div>
  </div>

  <!-- Gallery -->
  <div class="gallery-section">
    <h2 class="section-title">Treat Gallery</h2>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">×</button>
      <img class="modal-img" id="modalImg" src="" alt="">
      <div class="modal-body">
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-note" id="modalNote"></p>
        <div class="modal-buttons">
          <button class="big-button primary" id="btnText2">
            <span class="button-icon">📱</span> Text About This
          </button>
          <button class="big-button messenger" id="btnMsg2">
            <span class="button-icon">💬</span> Ask on Messenger
          </button>
          <button class="big-button facebook" id="btnFB2">
            <span class="button-icon">👍</span> View Facebook Page
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-buttons">
      <button class="footer-button" id="btnText3">📱 Text</button>
      <button class="footer-button" id="btnMsg3">💬 Messenger</button>
    </div>
  </div>

  <script>
    // ✅ SET THESE LINKS (replace with your real links)
    const LINKS = {
      phoneNumber: "15555551234",
      facebookPageUrl: "https://www.facebook.com/yourpage",
      messengerUrl: "https://m.me/yourpage"
    };

    const BRAND = {
      name: "Mom's Sweet Treats",
      subtitle: "Made with love • Local pickup • Message to order"
    };

    // Gallery (swap these later)
    const GALLERY = [
      { title: "Chocolate Cake", note: "Rich chocolate layers with buttercream frosting", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1200&q=80" },
      { title: "Rainbow Cupcakes", note: "Colorful vanilla cupcakes with sprinkles", img: "https://images.unsplash.com/photo-1557925923-33b27f3e5c35?auto=format&fit=crop&w=1200&q=80" },
      { title: "Cookies", note: "Soft & chewy chocolate chip cookies", img: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=1200&q=80" },
      { title: "Brownies", note: "Fudgy brownies with walnuts", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=1200&q=80" },
      { title: "Strawberry Cake", note: "Fresh strawberries with whipped cream", img: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=1200&q=80" },
      { title: "Donuts", note: "Assorted glazed and sprinkled donuts", img: "https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=1200&q=80" },
      { title: "Birthday Cake", note: "Custom colors • Any theme available", img: "https://images.unsplash.com/photo-1535141192574-5d4897c12636?auto=format&fit=crop&w=1200&q=80" },
      { title: "Macarons", note: "Assorted flavors in a gift box", img: "https://images.unsplash.com/photo-1569929238190-869826b1bb05?auto=format&fit=crop&w=1200&q=80" }
    ];

    // DOM
    const grid = document.getElementById("grid");
    const brandName = document.getElementById("brandName");
    const brandSub = document.getElementById("brandSub");

    const modal = document.getElementById("modal");
    const closeModal = document.getElementById("closeModal");
    const modalImg = document.getElementById("modalImg");
    const modalTitle = document.getElementById("modalTitle");
    const modalNote = document.getElementById("modalNote");

    const btnText = document.getElementById("btnText");
    const btnFB = document.getElementById("btnFB");
    const btnMsg = document.getElementById("btnMsg");

    const btnText2 = document.getElementById("btnText2");
    const btnMsg2 = document.getElementById("btnMsg2");
    const btnFB2 = document.getElementById("btnFB2");

    const btnText3 = document.getElementById("btnText3");
    const btnMsg3 = document.getElementById("btnMsg3");

    // Set brand text
    brandName.textContent = BRAND.name;
    brandSub.textContent = BRAND.subtitle;

    function openUrl(url){
      if (!url || url.includes("yourpage")) {
        alert("Set your mom’s real Facebook/Messenger link in LINKS first.");
        return;
      }
      window.open(url, "_blank");
    }

    function openText(itemTitle = "a treat") {
      const num = (LINKS.phoneNumber || "").replace(/\D/g, "");
      if (!num || num === "15555551234") {
        alert("Set your mom’s real phone number in LINKS first.");
        return;
      }
      const body = encodeURIComponent(`Hi! I saw "${itemTitle}" on your site. Is it available?`);
      // Works best on phones. On desktop, this may do nothing (normal).
      window.location.href = `sms:${num}?&body=${body}`;
    }

    function wireButtons(currentTitle = "a treat"){
      btnText.onclick = () => openText(currentTitle);
      btnText2.onclick = () => openText(currentTitle);
      btnText3.onclick = () => openText(currentTitle);

      btnFB.onclick = () => openUrl(LINKS.facebookPageUrl);
      btnFB2.onclick = () => openUrl(LINKS.facebookPageUrl);

      btnMsg.onclick = () => openUrl(LINKS.messengerUrl);
      btnMsg2.onclick = () => openUrl(LINKS.messengerUrl);
      btnMsg3.onclick = () => openUrl(LINKS.messengerUrl);
    }

    function escapeHtml(text){
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderGallery(){
      grid.innerHTML = "";
      GALLERY.forEach(item => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `
          <img class="tile-img" src="${item.img}" alt="${escapeHtml(item.title)}">
          <div class="tile-content">
            <div class="tile-title">${escapeHtml(item.title)}</div>
            <div class="tile-note">${escapeHtml(item.note)}</div>
          </div>
        `;
        tile.onclick = () => openModal(item);
        grid.appendChild(tile);
      });
    }

    function openModal(item){
      modalTitle.textContent = item.title;
      modalNote.textContent = item.note;
      modalImg.src = item.img;
      modal.classList.add("show");
      wireButtons(item.title);
    }

    closeModal.onclick = () => modal.classList.remove("show");
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("show"); };

    // small “press” animation
    document.addEventListener("click", (e) => {
      if (e.target && e.target.tagName === "BUTTON") {
        const b = e.target;
        const prev = b.style.transform;
        b.style.transform = "scale(0.98)";
        setTimeout(() => b.style.transform = prev, 140);
      }
    });

    // init
    wireButtons("a treat");
    renderGallery();
    console.log("Sweet Treats loaded 🍰");
  </script>
</body>
</html>
