<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mom's Sweet Treats</title>

  <style>
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, #3a2233 0%, transparent 55%),
        radial-gradient(1200px 600px at 80% 10%, #1f2b3a 0%, transparent 55%),
        #141218;
      color:#f2f2f2;
      line-height:1.5;
      padding-bottom:90px;
    }

    /* Header */
    .header{
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      color:#fff;
      padding:1.5rem 1rem;
      text-align:center;
      box-shadow: 0 6px 20px rgba(255, 118, 140, 0.25);
    }
    .brand-name{
      font-size:2.2rem;
      font-weight:800;
      margin-bottom:0.4rem;
    }
    .brand-subtitle{
      font-size:1.05rem;
      opacity:0.95;
      max-width:650px;
      margin:0 auto;
    }

    /* Hero */
    .hero{
      width:100%;
      height:280px;
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url('https://images.unsplash.com/photo-1535141192574-5d4897c12636?auto=format&fit=crop&w=1200&q=80');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:2rem;
    }
    .hero-text{
      text-align:center;
      padding:0 1rem;
    }
    .hero-text h1{
      font-size:2.3rem;
      margin-bottom:0.4rem;
    }
    .hero-text p{
      font-size:1.15rem;
      opacity:0.9;
    }

    /* Gallery */
    .gallery-section{
      padding: 0 1rem;
    }
    .section-title{
      font-size:1.7rem;
      color:#ff8fb8;
      margin-bottom:1.3rem;
      text-align:center;
      font-weight:750;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap:1.5rem;
      max-width:1200px;
      margin:0 auto;
    }
    .tile{
      background:#1d1b22;
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      transition: transform 0.2s ease;
      cursor:pointer;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .tile:hover{
      transform: translateY(-4px);
    }
    .tile-img{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
    }
    .tile-content{
      padding:1.1rem;
    }
    .tile-title{
      font-size:1.35rem;
      font-weight:750;
      color:#fff;
      margin-bottom:0.35rem;
    }
    .tile-note{
      font-size:1rem;
      color:#cfcfd4;
    }

    /* Modal */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.9);
      z-index:1000;
      align-items:center;
      justify-content:center;
      padding:1rem;
    }
    .modal.show{
      display:flex;
    }
    .modal-content{
      background:#1c1a21;
      border-radius:20px;
      width:100%;
      max-width:520px;
      overflow:hidden;
      position:relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .modal-img{
      width:100%;
      height:300px;
      object-fit:cover;
    }
    .modal-body{
      padding:1.4rem;
    }
    .modal-title{
      font-size:1.8rem;
      font-weight:800;
      margin-bottom:0.4rem;
    }
    .modal-note{
      font-size:1.1rem;
      color:#cfcfd4;
      margin-bottom:1.2rem;
    }

    .modal-buttons{
      display:grid;
      gap:0.9rem;
    }

    .big-button{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border-radius:14px;
      padding:1rem;
      font-size:1.15rem;
      font-weight:700;
      border:none;
      cursor:pointer;
    }

    .big-button.primary{
      background: linear-gradient(135deg, #ff7eb3, #ff9bc9);
      color:white;
    }
    .big-button.messenger{
      background:#2a3b55;
      color:#dbeafe;
    }
    .big-button.facebook{
      background:#243b6b;
      color:#e0e7ff;
    }

    .close-modal{
      position:absolute;
      top:14px;
      right:14px;
      background:#fff;
      border:none;
      width:44px;
      height:44px;
      border-radius:50%;
      font-size:1.6rem;
      cursor:pointer;
    }

    /* Footer */
    .footer{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      background:#1b1920;
      padding:0.9rem 1rem;
      border-top:1px solid rgba(255,255,255,0.06);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
    }
    .footer-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0.8rem;
      max-width:520px;
      margin:0 auto;
    }
    .footer-button{
      background:#26242c;
      color:#fff;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:0.9rem;
      font-size:1.05rem;
      font-weight:700;
      cursor:pointer;
    }

    @media (max-width:480px){
      .footer-buttons{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="brand-name" id="brandName">Mom's Sweet Treats</div>
    <div class="brand-subtitle" id="brandSub">Made with love • Local pickup • Message anytime</div>
  </div>

  <div class="hero">
    <div class="hero-text">
      <h1>Sweet Treats Made Fresh</h1>
      <p>Tap a photo to see it bigger</p>
    </div>
  </div>

  <div class="gallery-section">
    <h2 class="section-title">Treat Gallery</h2>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">×</button>
      <img class="modal-img" id="modalImg">
      <div class="modal-body">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-note" id="modalNote"></div>
        <div class="modal-buttons">
          <button class="big-button primary" id="btnText2">📱 Text about this</button>
          <button class="big-button messenger" id="btnMsg2">💬 Messenger</button>
          <button class="big-button facebook" id="btnFB2">👍 Facebook</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-buttons">
      <button class="footer-button" id="btnText3">📱 Text</button>
      <button class="footer-button" id="btnMsg3">💬 Messenger</button>
    </div>
  </div>

<script>
const LINKS = {
  phoneNumber: "15555551234",
  facebookPageUrl: "https://www.facebook.com/yourpage",
  messengerUrl: "https://m.me/yourpage"
};

const GALLERY = [
  { title:"Chocolate Cake", note:"Rich chocolate layers", img:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1200&q=80" },
  { title:"Cupcakes", note:"Colorful & fun", img:"https://images.unsplash.com/photo-1557925923-33b27f3e5c35?auto=format&fit=crop&w=1200&q=80" },
  { title:"Cookies", note:"Soft & chewy", img:"https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=1200&q=80" },
  { title:"Brownies", note:"Fudgy & rich", img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=1200&q=80" }
];

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalTitle = document.getElementById("modalTitle");
const modalNote = document.getElementById("modalNote");

function openText(title){
  const num = LINKS.phoneNumber.replace(/\D/g,"");
  const body = encodeURIComponent(`Hi! I saw "${title}" on your site. Is it available?`);
  window.location.href = `sms:${num}?&body=${body}`;
}

function openUrl(url){
  window.open(url,"_blank");
}

function render(){
  grid.innerHTML="";
  GALLERY.forEach(item=>{
    const d=document.createElement("div");
    d.className="tile";
    d.innerHTML=`<img class="tile-img" src="${item.img}"><div class="tile-content"><div class="tile-title">${item.title}</div><div class="tile-note">${item.note}</div></div>`;
    d.onclick=()=>openModal(item);
    grid.appendChild(d);
  });
}

function openModal(item){
  modalImg.src=item.img;
  modalTitle.textContent=item.title;
  modalNote.textContent=item.note;
  modal.classList.add("show");

  document.getElementById("btnText2").onclick=()=>openText(item.title);
  document.getElementById("btnMsg2").onclick=()=>openUrl(LINKS.messengerUrl);
  document.getElementById("btnFB2").onclick=()=>openUrl(LINKS.facebookPageUrl);
}

document.getElementById("closeModal").onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{ if(e.target===modal) modal.classList.remove("show"); };

document.getElementById("btnText3").onclick=()=>openText("a treat");
document.getElementById("btnMsg3").onclick=()=>openUrl(LINKS.messengerUrl);

render();
</script>

</body>
</html>
